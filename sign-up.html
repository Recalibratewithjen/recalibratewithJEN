<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Recalibrate with Jen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="signup-container">
<header class="signup-header">
<h1>Join the Recalibrate Tribe</h1>
<p>Your journey to discipline, energy, and empowerment starts here.</p>
</header>
<section class="signup-form">
<form action="tribe-welcome.html" method="POST">
<div class="form-group">
<label for="username">Username</label>
<input type="text" id="username" name="username" required>
</div>
<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" name="email" required>
</div>
<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" required>
</div>
<div class="form-group">
<label for="confirm_password">Confirm Password</label>
<input type="password" id="confirm_password" name="confirm_password" required>
</div>
<button type="submit" class="cta-button">Sign Up</button>
</form>
</section>
<footer class="signup-footer">
<p>Already a member? <a href="login.html">Login here</a></p>
</footer>
</div>
</body>
</html>
